<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>學習歷程工具包</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<style>
/* Layout: 工具包 — 頂部兩個大抽屜（課程／多元），抽屜裡四件工具依序排成分頁，一次只拿出一件 */
:root{
  --bg:#eef1ec; --paper:#ffffff; --ink:#1b2626; --muted:#566664; --line:#d5ddd8;
  --course:#b8541f; --course-soft:#fbeadf; --multi:#1f6b63; --multi-soft:#dcefeb;
  --cat:var(--course); --cat-soft:var(--course-soft);
  --ok:#2f7d3a; --ok-soft:#e3f2e4; --warn:#a5401a; --warn-soft:#fbe5da; --mark:#ffe28a;
  --b1:#1f6b63; --b2:#b8541f; --b3:#5b5fa8; --b4:#8a6d12; --b5:#a3366b;
  --f-display:"LXGW WenKai TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131a19; --paper:#1b2423; --ink:#e5ebe9; --muted:#9db0ac; --line:#2e3b39;
  --course:#f0965f; --course-soft:#3a2518; --multi:#6cc2b5; --multi-soft:#1d3532;
  --ok:#8bd39a; --ok-soft:#1c3221; --warn:#f0936d; --warn-soft:#3a2219; --mark:#6b5a1c;
  --b1:#6cc2b5; --b2:#f0965f; --b3:#a3a7ef; --b4:#e0c25a; --b5:#e98bb8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131a19; --paper:#1b2423; --ink:#e5ebe9; --muted:#9db0ac; --line:#2e3b39;
  --course:#f0965f; --course-soft:#3a2518; --multi:#6cc2b5; --multi-soft:#1d3532;
  --ok:#8bd39a; --ok-soft:#1c3221; --warn:#f0936d; --warn-soft:#3a2219; --mark:#6b5a1c;
  --b1:#6cc2b5; --b2:#f0965f; --b3:#a3a7ef; --b4:#e0c25a; --b5:#e98bb8; color-scheme:dark}
body.is-multi{--cat:var(--multi);--cat-soft:var(--multi-soft)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7}
a{color:var(--cat)}
:focus-visible{outline:3px solid var(--cat);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
mark{background:linear-gradient(transparent 45%,var(--mark) 45%);color:inherit}

header.top{padding-block:32px 18px}
.eyebrow{font-size:13px;letter-spacing:.12em;color:var(--muted)}
h1{font-family:var(--f-display);font-size:clamp(32px,6.5vw,46px);line-height:1.2;margin:4px 0 6px}
.lead{color:var(--muted);margin:0;max-width:62ch}

.drawers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.drawer{font:inherit;color:var(--ink);text-align:left;cursor:pointer;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:2px;min-width:0}
.drawer b{font-family:var(--f-display);font-size:clamp(19px,4vw,24px)}
.drawer small{color:var(--muted);font-size:13px}
.drawer[data-cat=course].on{border-color:var(--course);background:var(--course-soft)}
.drawer[data-cat=multi].on{border-color:var(--multi);background:var(--multi-soft)}
.drawer .badge{justify-self:start;font-size:12px;font-weight:700;padding:0 8px;border-radius:6px;color:var(--paper)}
.drawer[data-cat=course] .badge{background:var(--course)}
.drawer[data-cat=multi] .badge{background:var(--multi)}

.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-top:16px;border-bottom:1px solid var(--line)}
.tools .wrap{display:flex;gap:6px;overflow-x:auto;padding-block:8px;scrollbar-width:none}
.tools button{flex:0 0 auto;font:inherit;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--muted);border-radius:999px;padding:6px 14px;white-space:nowrap}
.tools button .n{font-weight:700;margin-right:4px;font-variant-numeric:tabular-nums}
.tools button.on{background:var(--cat);border-color:var(--cat);color:var(--paper)}
.tools button.done:not(.on){border-color:var(--cat);color:var(--cat)}

main{padding-block:18px 64px}
.panel{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--cat);border-radius:6px 6px 14px 14px;padding:24px clamp(16px,4vw,32px);display:grid;gap:16px;min-width:0}
h2{font-family:var(--f-display);font-size:clamp(23px,4.5vw,30px);margin:0;line-height:1.3}
h3{font-size:16px;margin:4px 0 0}
.hint{font-size:14px;color:var(--muted);margin:0}
p{margin:0;max-width:68ch}
.ctx{font-size:14px;color:var(--cat);font-weight:500}

.group{display:grid;gap:6px}
.group > span{font-size:13px;color:var(--muted);letter-spacing:.05em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:15px;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 14px}
.chip:hover{border-color:var(--cat)}
.chip.on{background:var(--cat);border-color:var(--cat);color:var(--paper);font-weight:700}

.q{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px;min-width:0}
.q label{font-weight:500}
.q .lb{display:inline-block;font-size:12px;font-weight:700;color:var(--cat);background:var(--cat-soft);border-radius:6px;padding:0 8px;margin-right:6px}
input[type=text],textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:76px;resize:vertical}

.btn{font:inherit;font-size:15px;cursor:pointer;border:1px solid var(--cat);background:transparent;color:var(--cat);border-radius:10px;padding:8px 16px}
.btn.solid{background:var(--cat);color:var(--paper)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.status{font-size:14px;color:var(--muted)}
.note{border-left:4px solid var(--cat);background:var(--cat-soft);padding:10px 14px;border-radius:0 10px 10px 0;font-size:15px}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}

.result{display:grid;gap:14px;border-top:1px dashed var(--line);padding-top:16px}
.titles{display:grid;gap:6px}
.titles .chip{text-align:left}
.mm{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.mm svg{display:block;min-width:720px;width:100%;height:auto}
.slides{display:grid;gap:10px}
.sl{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
.sl .num{width:30px;height:30px;border-radius:8px;background:var(--cat-soft);color:var(--cat);display:grid;place-items:center;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.sl > div{display:grid;gap:4px;min-width:0}
.sl textarea{min-height:64px}
.missing{margin:0;padding-left:1.2em;font-size:15px}

.tpls{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.tpl{border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;align-content:start;min-width:0}
.tpl h3{font-family:var(--f-display);font-size:20px;margin:0}
.mini{aspect-ratio:16/9;border-radius:8px;border:1px solid var(--line);position:relative;overflow:hidden;max-width:100%}
.swatches{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.sw{width:22px;height:22px;border-radius:6px;border:1px solid var(--line)}
.tpl ul{margin:0;padding-left:1.1em;font-size:14px;color:var(--muted)}
.tpl .row{gap:8px}
.tpl .btn{font-size:14px;padding:6px 12px}
/* mini previews: fixed print colors, they depict the downloadable file */
.mA{background:#ffffff}
.mA::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6%;background:#1f6b63}
.mA i{position:absolute;left:12%;height:7%;border-radius:3px;background:#c9d6d2}
.mA i.t{top:14%;width:55%;height:11%;background:#1f6b63}
.mB{background:#f7f2ea}
.mB::before{content:"";position:absolute;left:6%;top:16%;width:44%;height:68%;border:2px dashed #c2562b;border-radius:6px}
.mB i{position:absolute;left:56%;height:7%;border-radius:3px;background:#e2cdb8}
.mB i.t{top:16%;width:36%;height:11%;background:#c2562b}
.mC{background:#ffffff}
.mC i{position:absolute;top:30%;width:27%;height:56%;border-radius:8px}
.mC i.t{top:8%;left:6%;width:50%;height:11%;background:#2b3a67;border-radius:3px}

.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;display:grid;gap:8px;justify-items:center}
.drop.over{border-color:var(--cat);background:var(--cat-soft)}
.files{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.files span{font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.checks li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:15px}
.pill{font-size:12px;font-weight:700;padding:1px 8px;border-radius:6px;white-space:nowrap;margin-top:3px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.fix{background:var(--warn-soft);color:var(--warn)}
.fb{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.fb > div{border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.fb ul{margin:6px 0 0;padding-left:1.1em;font-size:15px}
.navrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:14px}
footer{color:var(--muted);font-size:13px;padding-block:0 40px}
@media (max-width:420px){.drawers{grid-template-columns:1fr}}
</style>
</head>
<body>


<header class="top"><div class="wrap">
  <div class="eyebrow">武陵高中 資源教室</div>
  <h1>學習歷程工具包</h1>
  <p class="lead">先選要做哪一類，再照 1 → 4 的工具一步一步完成：選科目或類別、整理想法、套簡報模板、檢查初稿。</p>
  <div class="drawers" role="tablist" aria-label="成果類型">
    <button class="drawer" data-cat="course" type="button" role="tab"><span class="badge">要老師認證</span><b>課程學習成果</b><small>國英數、自然、社會、藝能、科技……課堂上的作品與報告</small></button>
    <button class="drawer" data-cat="multi" type="button" role="tab"><span class="badge">不用認證</span><b>多元表現</b><small>社團、幹部、服務學習、檢定、競賽、自主學習……</small></button>
  </div>
</div></header>

<nav class="tools" aria-label="工具"><div class="wrap" id="toolTabs"></div></nav>

<main class="wrap"><section class="panel" id="panel" aria-live="polite"></section></main>

<footer><div class="wrap">寫好的內容只存在這台裝置的瀏覽器。在 claude.ai 開啟並登入時可使用 AI 功能，其他情況會自動使用基本版。上傳平台：<a href="https://schoolsys.wlsh.tyc.edu.tw/WLSHTYC/Auth/Auth/CloudLogin?sys=Auth" target="_blank" rel="noopener">武陵學習歷程平台</a></div></footer>

<script id="ppt-builder">
/* 產生 PPT：純函式，P 為 PptxGenJS 實例 */
function buildDeck(P, d, tplId, blank){
  const F = "Microsoft JhengHei";
  const T = {
    A:{bg:"FFFFFF",accent:"1F6B63",soft:"E1EFEC",ink:"1D2A2A",muted:"5B6A68"},
    B:{bg:"F7F2EA",accent:"C2562B",soft:"F1E1D2",ink:"2B2219",muted:"6E5E50"},
    C:{bg:"FFFFFF",accent:"2B3A67",soft:"EEF0F7",ink:"1E2333",muted:"5C6378",cards:["E3F1EE","FBE9DF","ECEBFA"],cardInk:["1F6B63","B8541F","5B5FA8"]}
  }[tplId];
  P.layout = "LAYOUT_16x9";
  const title = d.title || (blank ? "（在這裡寫你的標題）" : d.sub);
  const sub = (d.catName||"") + "｜" + (d.sub||"");
  const slides = d.slides && d.slides.length ? d.slides : [];
  const bulletsOf = s => (s.bullets||[]).filter(Boolean).map(b=>({text:b,options:{bullet:true,breakLine:true}}));

  // cover
  let s = P.addSlide(); s.background = {color:T.bg};
  if(tplId==="A"){
    s.addShape(P.ShapeType.rect,{x:0,y:0,w:0.35,h:5.625,fill:{color:T.accent},line:{color:T.accent}});
    s.addText(title,{x:0.9,y:1.6,w:8.4,h:1.4,fontFace:F,fontSize:36,bold:true,color:T.ink,valign:"bottom"});
    s.addText(sub,{x:0.9,y:3.1,w:8.4,h:0.5,fontFace:F,fontSize:18,color:T.accent});
    s.addText("姓名：＿＿＿＿＿　班級：＿＿＿",{x:0.9,y:4.5,w:8.4,h:0.4,fontFace:F,fontSize:14,color:T.muted});
  } else if(tplId==="B"){
    s.addShape(P.ShapeType.rect,{x:5.4,y:0.6,w:4.0,h:4.4,fill:{color:T.soft},line:{color:T.accent,dashType:"dash",width:1.5}});
    s.addText("放一張作品\n最好看的照片",{x:5.4,y:0.6,w:4.0,h:4.4,fontFace:F,fontSize:16,color:T.muted,align:"center",valign:"middle"});
    s.addText(title,{x:0.6,y:1.2,w:4.5,h:2.0,fontFace:F,fontSize:32,bold:true,color:T.ink,valign:"bottom"});
    s.addShape(P.ShapeType.rect,{x:0.6,y:3.35,w:1.2,h:0.08,fill:{color:T.accent},line:{color:T.accent}});
    s.addText(sub,{x:0.6,y:3.5,w:4.5,h:0.5,fontFace:F,fontSize:16,color:T.accent});
  } else {
    s.addShape(P.ShapeType.rect,{x:0,y:0,w:10,h:5.625,fill:{color:T.accent},line:{color:T.accent}});
    s.addText(title,{x:0.8,y:1.5,w:8.4,h:1.6,fontFace:F,fontSize:36,bold:true,color:"FFFFFF",valign:"bottom"});
    s.addText(sub,{x:0.8,y:3.2,w:8.4,h:0.5,fontFace:F,fontSize:18,color:"C9D0E6"});
  }

  if(tplId==="C"){
    // 架構心智圖頁
    const mm = d.mindmap;
    s = P.addSlide(); s.background={color:T.bg};
    s.addText("我的學習架構",{x:0.5,y:0.3,w:9,h:0.6,fontFace:F,fontSize:24,bold:true,color:T.accent});
    const br = (mm && mm.branches && mm.branches.length) ? mm.branches.slice(0,5) : [];
    s.addText(mm && mm.center ? mm.center : title,{shape:P.ShapeType.roundRect,x:0.4,y:2.3,w:2.4,h:1.0,rectRadius:0.15,fill:{color:T.accent},color:"FFFFFF",fontFace:F,fontSize:14,bold:true,align:"center",valign:"middle"});
    const n = Math.max(br.length,1), top=1.05, span=4.3, h=span/n;
    br.forEach((b,i)=>{
      const y = top + i*h, ci=i%3;
      s.addShape(P.ShapeType.line,{x:2.8,y:2.8,w:0.5,h:(y+h/2-0.02)-2.8,line:{color:T.muted,width:1}});
      s.addText(b.label,{shape:P.ShapeType.roundRect,x:3.3,y:y+h/2-0.25,w:1.5,h:0.5,rectRadius:0.1,fill:{color:T.cards[ci]},color:T.cardInk[ci],fontFace:F,fontSize:13,bold:true,align:"center",valign:"middle"});
      s.addText((b.items||[]).slice(0,3).map(t=>({text:t,options:{bullet:true,breakLine:true}})),{x:5.0,y:y+0.02,w:4.6,h:h-0.04,fontFace:F,fontSize:13,color:T.ink,valign:"middle"});
    });
    if(!br.length) s.addText(blank?"（用工具 2 產生心智圖後，再下載「填入我的內容」就會出現在這裡）":"（還沒有心智圖）",{x:3.3,y:2.4,w:6,h:0.8,fontFace:F,fontSize:14,color:T.muted});
  }

  slides.forEach((sl,i)=>{
    s = P.addSlide(); s.background={color:T.bg};
    const bl = bulletsOf(sl);
    if(tplId==="A"){
      s.addShape(P.ShapeType.rect,{x:0,y:0,w:0.35,h:5.625,fill:{color:T.accent},line:{color:T.accent}});
      s.addText(sl.heading,{x:0.8,y:0.4,w:8.6,h:0.8,fontFace:F,fontSize:28,bold:true,color:T.accent});
      s.addShape(P.ShapeType.rect,{x:0.8,y:1.25,w:8.6,h:0.03,fill:{color:T.soft},line:{color:T.soft}});
      s.addText(bl.length?bl:[{text:" ",options:{}}],{x:0.8,y:1.45,w:8.6,h:3.7,fontFace:F,fontSize:20,color:T.ink,valign:"top",paraSpaceAfter:8});
    } else if(tplId==="B"){
      s.addText(sl.heading,{x:0.6,y:0.35,w:8.8,h:0.7,fontFace:F,fontSize:26,bold:true,color:T.accent});
      s.addShape(P.ShapeType.rect,{x:0.6,y:1.2,w:4.3,h:3.8,fill:{color:T.soft},line:{color:T.accent,dashType:"dash",width:1.5}});
      s.addText("放照片或截圖\n（記得在下面寫一句說明）",{x:0.6,y:1.2,w:4.3,h:3.8,fontFace:F,fontSize:14,color:T.muted,align:"center",valign:"middle"});
      s.addText(bl.length?bl:[{text:" ",options:{}}],{x:5.2,y:1.2,w:4.3,h:3.8,fontFace:F,fontSize:17,color:T.ink,valign:"top",paraSpaceAfter:6});
    } else {
      const ci=i%3;
      s.addText(String(i+1),{shape:P.ShapeType.ellipse,x:0.5,y:0.4,w:0.7,h:0.7,fill:{color:T.cards[ci]},color:T.cardInk[ci],fontFace:F,fontSize:20,bold:true,align:"center",valign:"middle"});
      s.addText(sl.heading,{x:1.4,y:0.4,w:8.1,h:0.7,fontFace:F,fontSize:26,bold:true,color:T.accent,valign:"middle"});
      s.addShape(P.ShapeType.roundRect,{x:0.5,y:1.4,w:9.0,h:3.8,rectRadius:0.12,fill:{color:T.cards[ci]},line:{color:T.cards[ci]}});
      s.addText(bl.length?bl:[{text:" ",options:{}}],{x:0.8,y:1.6,w:8.4,h:3.4,fontFace:F,fontSize:19,color:T.ink,valign:"top",paraSpaceAfter:8});
    }
  });
  return P;
}
</script>

<script>
(function(){
  const PLATFORM = "https://schoolsys.wlsh.tyc.edu.tw/WLSHTYC/Auth/Auth/CloudLogin?sys=Auth";
  const store = {
    get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
    set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  };
  const el = (tag, attrs={}, ...kids)=>{
    const n=document.createElement(tag);
    for(const [k,v] of Object.entries(attrs)){
      if(v==null||v===false) continue;
      if(k==="class") n.className=v; else if(k==="text") n.textContent=v;
      else if(k.startsWith("on")) n.addEventListener(k.slice(2),v); else n.setAttribute(k,v);
    }
    kids.flat().forEach(c=>{ if(c!=null&&c!==false) n.append(c); });
    return n;
  };
  const NS="http://www.w3.org/2000/svg";
  const svg=(tag,attrs={},text)=>{const n=document.createElementNS(NS,tag);for(const[k,v] of Object.entries(attrs))n.setAttribute(k,v);if(text!=null)n.textContent=text;return n;};

  /* ---------- 思考架構 ---------- */
  const Q=(label,q,ph)=>({label,q,ph});
  const COURSE = [

  function parseAI(txt){
    const r={titles:[],mindmap:{center:"",branches:[]},slides:[],summary:"",missing:[]};
    let sec="", slide=null;
    txt.split(/\r?\n/).forEach(raw=>{
      const line=raw.replace(/\*\*/g,"").replace(/^#+\s*/,"").trim();
      if(!line) return;
      let m;
      if(/^【標題】/.test(line)){sec="t";return;}
      if(/^【心智圖】/.test(line)){sec="m";return;}
      if((m=line.match(/^【第\s*(\d+)\s*頁】\s*(.*)$/))){sec="s";slide={heading:m[2]||"",bullets:[]};r.slides.push(slide);return;}
      if((m=line.match(/^【簡述】\s*(.*)$/))){sec="u";if(m[1])r.summary+=m[1];return;}
      if(/^【還可以補充】/.test(line)){sec="x";return;}
      const item=line.replace(/^([-•*‧・]|\d+[\.、)）])\s*/,"").trim();
      if(!item) return;
      if(sec==="t") r.titles.push(item);
      else if(sec==="m"){
        if((m=line.match(/^中心[:：]\s*(.+)$/))) r.mindmap.center=m[1];
        else if((m=item.match(/^(.+?)[:：]\s*(.+)$/))) r.mindmap.branches.push({label:m[1],items:m[2].split(/[；;]/).map(x=>x.trim()).filter(Boolean)});
      }
      else if(sec==="s"&&slide){ if(!slide.heading&&!/^[-•*‧・]/.test(line)) slide.heading=item; else slide.bullets.push(item); }
      else if(sec==="u") r.summary+=item;
      else if(sec==="x") r.missing.push(item);
    });
    r.titles=r.titles.slice(0,3);
    return r;
  }

      el("div",{class:"row",style:"margin-top:8px;font-size:14px"},"貼到：",...AI_SITES.map(([n,u])=>el("a",{href:u,target:"_blank",rel:"noopener",text:n}))),
      el("p",{class:"hint",style:"margin-top:6px",text:"使用前請確認符合該 AI 平台的年齡規定。初稿裡如果有姓名、學號，請先刪掉再貼。"}));
    async function run(){
      msg.textContent="讀取中……"; runBtn.disabled=true;

        const prompt=[
          "你是台灣高中學習歷程檔案的審閱老師，學生在資源教室，請用溫和、具體、短句的方式回饋，繁體中文。",
          `類型：${CAT_NAME[st.cat]}　細項：${st.sub[st.cat]}`,
          useImgs.length?`附上 ${useImgs.length} 張學生簡報的截圖，請一併看文字內容與版面設計。`:"沒有圖片，只評文字；design 欄位給一般版面建議即可。",
          "學生初稿文字：", text||"（見圖片）", "",
          "依以下 7 項檢核，每項 status 只能是 ok 或 fix，note 30 字內說明原因或怎麼改：動機、過程具體、困難與解決、反思收穫、與"+(st.cat==="course"?"科目內容":"活動性質")+"的連結、標題清楚、版面易讀。",
          "不要替學生重寫全文，只給方向和一兩句示範。",

          drawReview(r,imgs.length&&!useImgs.length?"這個環境不能傳圖片給 AI，只檢核了文字。":"");

      runBtn.disabled=false;
    }
    function localReview(t){
      const R={motive:/因為|好奇|想要|想知道|原因|動機|一開始/,detail:/\d|[一二三四五六七八九十兩]+(週|次|小時|天|個|頁|張|人)|首先|接著|最後/,trouble:/困難|問題|卡住|失敗|不會|遇到|挑戰/,solve:/解決|嘗試|後來|改成|請教|調整|重新/,reflect:/學到|發現|體會|了解到|明白|原來|下次|改進/,vague:/很好玩|很有趣|很棒|很開心|收穫很多|學到很多|很有意義|受益良多/g};
      const v=t.match(R.vague)||[];

        {item:"動機",status:R.motive.test(t)?"ok":"fix",note:R.motive.test(t)?"有寫為什麼做。":"加一句「我會做這個是因為……」。"},
        {item:"過程具體",status:R.detail.test(t)?"ok":"fix",note:R.detail.test(t)?"有步驟或數字。":"寫出花了幾週、做了幾次、用了什麼方法。"},

        {item:"反思收穫",status:R.reflect.test(t)?"ok":"fix",note:R.reflect.test(t)?"有寫學到什麼。":"用「我學到……」「下次我會……」寫一句。"},
        {item:"空泛用詞",status:v.length?"fix":"ok",note:v.length?`把「${[...new Set(v)].join("」「")}」改成具體說明。`:"沒有空泛的形容詞。"}
      ],strengths:[],writing:[],design:["一頁一個重點，最多 5 行字","字不要小於 18pt","照片配一句說明"],next:"",local:true};
    }
    function drawReview(r,warn){
      out.hidden=false; out.innerHTML="";

      out.append(el("h3",{text:"檢核表"}), el("ul",{class:"checks"},(r.checks||[]).map(c=>el("li",{},el("span",{class:"pill "+(c.status==="ok"?"ok":"fix"),text:c.status==="ok"?"OK":"要改"}),el("span",{},el("b",{text:c.item+"　"}),c.note||"")))));

      out.append(el("div",{class:"fb"},col("做得好的地方",r.strengths),col("寫作建議",r.writing),col("設計建議",r.design)));
      out.append(el("div",{class:"note"},el("b",{text:"改好之後"}),"存成 PDF，到",el("a",{href:PLATFORM,target:"_blank",rel:"noopener",text:"武陵學習歷程平台"}),st.cat==="course"?"上傳、貼上 100 字簡述，最後一定要按「送出認證」。":"上傳到多元表現對應的類別，貼上 100 字簡述。"));
    }
    return [
      el("h2",{text:"上傳初稿，檢核一下"}),
      el("p",{class:"ctx",text:CAT_NAME[st.cat]+"／"+st.sub[st.cat]}),
      el("p",{class:"hint",text:SAMPLE?"AI 會依 7 個項目檢核，並分別給寫作和設計建議。檔案只用來檢核，不會被存起來。":"目前是基本版：只檢查文字裡有沒有動機、具體過程、困難與解決、反思。登入 Claude 開啟這個網頁可使用 AI 檢核（含版面設計）。"}),
      drop,
      el("label",{for:"draft-text",class:"hint",text:"貼上文字（選填）"}), ta,
      d.ai?el("label",{class:"row",for:"use-mine",style:"gap:8px;font-size:15px"},useMine,"一起檢核我在工具 2 整理的內容"):null,
      el("div",{class:"row"},runBtn,msg),
